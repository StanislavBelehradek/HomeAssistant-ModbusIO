name: "Modbus IO (Eletechsup)"
version: "0.1.0"
slug: "modbusio"
description: "Control and monitor Eletechsup Modbus RTU IO boards (M23IOxx relay/opto-input boards) via MQTT discovery."
url: "https://github.com/StanislavBelehradek/HomeAssistant-ModbusIO"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
uart: true
services:
  - "mqtt:want"
options:
  port: "/dev/ttyUSB0"
  baudrate: 9600
  parity: "N"
  poll_interval_ms: 20
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  discovery_prefix: "homeassistant"
  boards: []
schema:
  port: "str"
  baudrate: "int"
  parity: "list(N|E|O)"
  poll_interval_ms: "int(0,60000)"
  mqtt_host: "str?"
  mqtt_port: "port?"
  mqtt_username: "str?"
  mqtt_password: "password?"
  discovery_prefix: "str"
  boards:
    - name: "str"
      address: "int(1,247)"
      type: "list(M23IOA08|M23IOB16|M23IOC24|M23IOD32|M23IOE48|M23IOF64)"
      mode: "list(input|output|input_output)"
